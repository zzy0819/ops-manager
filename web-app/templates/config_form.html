{% extends 'base.html' %}
{% block title %}{{ '编辑配置变更' if config else '新增配置变更' }}{% endblock %}
{% block page_title %}{{ '编辑配置变更' if config else '新增配置变更' }}{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">变更时间 <span class="text-danger">*</span></label>
                    <input type="datetime-local" name="change_time" class="form-control" required
                           value="{{ config.change_time.strftime('%Y-%m-%dT%H:%M') if config else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">设备名称 <span class="text-danger">*</span></label>
                    <input type="text" name="device_name" class="form-control" placeholder="深信服 AF" required
                           value="{{ config.device_name if config else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">设备IP <span class="text-danger">*</span></label>
                    <input type="text" name="device_ip" class="form-control" placeholder="10.0.0.1" required
                           value="{{ config.device_ip if config else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">配置类型 <span class="text-danger">*</span></label>
                    <select name="config_type" class="form-select" required>
                        {% for t in config_type_list %}
                        <option value="{{ t }}" {% if config and config.config_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">操作人 <span class="text-danger">*</span></label>
                    <input type="text" name="operator" class="form-control" placeholder="张三" required
                           value="{{ config.operator if config else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">变更状态</label>
                    <select name="change_status" class="form-select">
                        {% for s in status_list %}
                        <option value="{{ s }}" {% if config and config.change_status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">变更内容 <span class="text-danger">*</span></label>
                    <textarea name="change_content" class="form-control" rows="4" placeholder="具体变更内容..." required>{{ config.change_content if config else '' }}</textarea>
                </div>
                <div class="col-md-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_rollback" id="is_rollback"
                               {% if config and config.is_rollback %}checked{% endif %}>
                        <label class="form-check-label" for="is_rollback">
                            是否回滚
                        </label>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {{ '更新' if config else '保存' }}
                    </button>
                    <a href="{{ url_for('configs.config_list') }}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> 取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
