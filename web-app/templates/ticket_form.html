{% extends 'base.html' %}
{% block title %}{{ '编辑工单' if ticket else '新建工单' }}{% endblock %}
{% block page_title %}{{ '编辑工单' if ticket else '新建工单' }}{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">工单号 <span class="text-danger">*</span></label>
                    <input type="text" name="ticket_number" class="form-control" placeholder="TK-20240101-001" required
                           value="{{ ticket.ticket_number if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">申请人 <span class="text-danger">*</span></label>
                    <input type="text" name="requester" class="form-control" placeholder="张三" required
                           value="{{ ticket.requester if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">部门</label>
                    <input type="text" name="department" class="form-control" placeholder="IT部"
                           value="{{ ticket.department if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">联系方式</label>
                    <input type="text" name="contact" class="form-control" placeholder="13800138000"
                           value="{{ ticket.contact if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">问题类型 <span class="text-danger">*</span></label>
                    <select name="problem_type" class="form-select" required>
                        {% for t in problem_type_list %}
                        <option value="{{ t }}" {% if ticket and ticket.problem_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">优先级</label>
                    <select name="priority" class="form-select">
                        {% for p in priority_list %}
                        <option value="{{ p }}" {% if ticket and ticket.priority == p %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        {% for s in status_list %}
                        <option value="{{ s }}" {% if ticket and ticket.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">处理人</label>
                    <input type="text" name="assignee" class="form-control" placeholder="李四"
                           value="{{ ticket.assignee if ticket else '' }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label">问题描述</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="请详细描述问题...">{{ ticket.description if ticket else '' }}</textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {{ '更新' if ticket else '保存' }}
                    </button>
                    <a href="{{ url_for('tickets.ticket_list') }}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> 取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
