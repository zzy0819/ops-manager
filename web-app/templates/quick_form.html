{% extends "base.html" %}
{% block title %}添加系统{% endblock %}
{% block page_title %}添加系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-plus-circle me-2"></i>{{ '编辑系统' if link else '添加系统' }}
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">系统名称 <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required
                                   value="{{ link.name if link else '' }}" placeholder="例如：深信服 AF">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">访问地址 <span class="text-danger">*</span></label>
                            <input type="text" name="url" class="form-control" required
                                   value="{{ link.url if link else '' }}"
                                   placeholder="https://10.0.0.1 或 /internal/page">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">描述</label>
                            <input type="text" name="description" class="form-control"
                                   value="{{ link.description if link else '' }}" placeholder="简短描述用途...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">用户名（可选）</label>
                            <input type="text" name="username" class="form-control"
                                   value="{{ link.username if link else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">密码（可选）</label>
                            <input type="password" name="password" class="form-control"
                                   value="{{ link.password if link else '' }}">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> {{ '更新' if link else '保存' }}
                            </button>
                            <a href="{{ url_for('quick_access.quick_access') }}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> 取消
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
