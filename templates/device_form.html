{% extends 'base.html' %}
{% block title %}{{ '编辑设备' if device else '新增设备' }}{% endblock %}
{% block page_title %}{{ '编辑设备' if device else '新增设备' }}{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">设备名称 <span class="text-danger">*</span></label>
                    <input type="text" name="device_name" class="form-control" placeholder="深信服 AF-1000" required
                           value="{{ device.device_name if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">设备类型 <span class="text-danger">*</span></label>
                    <select name="device_type" class="form-select" required>
                        {% for t in device_type_list %}
                        <option value="{{ t }}" {% if device and device.device_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">品牌</label>
                    <input type="text" name="brand" class="form-control" placeholder="深信服"
                           value="{{ device.brand if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">型号</label>
                    <input type="text" name="model" class="form-control" placeholder="AF-1000"
                           value="{{ device.model if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">序列号</label>
                    <input type="text" name="serial_number" class="form-control" placeholder="SN123456789"
                           value="{{ device.serial_number if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">IP地址</label>
                    <input type="text" name="ip_address" class="form-control" placeholder="10.0.0.1"
                           value="{{ device.ip_address if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">MAC地址</label>
                    <input type="text" name="mac_address" class="form-control" placeholder="00:11:22:33:44:55"
                           value="{{ device.mac_address if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">位置</label>
                    <input type="text" name="location" class="form-control" placeholder="机房A"
                           value="{{ device.location if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">机柜位置</label>
                    <input type="text" name="rack_position" class="form-control" placeholder="A-01"
                           value="{{ device.rack_position if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">负责人</label>
                    <input type="text" name="responsible_person" class="form-control" placeholder="张三"
                           value="{{ device.responsible_person if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">部门</label>
                    <input type="text" name="department" class="form-control" placeholder="IT部"
                           value="{{ device.department if device else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        {% for s in status_list %}
                        <option value="{{ s }}" {% if device and device.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">备注</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="其他备注信息...">{{ device.notes if device else '' }}</textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {{ '更新' if device else '保存' }}
                    </button>
                    <a href="{{ url_for('devices.device_list') }}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> 取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
