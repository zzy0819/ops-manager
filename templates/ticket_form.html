{% extends 'base.html' %}
{% block title %}{{ '编辑工单' if ticket else '新建工单' }}{% endblock %}
{% block page_title %}{{ '编辑工单' if ticket else '新建工单' }}{% endblock %}
{% block content %}

<h2 class="mb-3">
    <i class="bi bi-ticket-detailed text-warning"></i>
    {{ '编辑工单' if ticket else '新建工单' }}
</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">创建时间 <span class="text-danger">*</span></label>
                    <input type="datetime-local" name="create_time" class="form-control" required
                           value="{{ ticket.create_time.strftime('%Y-%m-%dT%H:%M') if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">申请人 <span class="text-danger">*</span></label>
                    <input type="text" name="requester" class="form-control" placeholder="张三" required
                           value="{{ ticket.requester if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">所在部门 <span class="text-danger">*</span></label>
                    <input type="text" name="department" class="form-control" placeholder="技术部" required
                           value="{{ ticket.department if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">联系方式 <span class="text-danger">*</span></label>
                    <input type="text" name="contact" class="form-control" placeholder="电话 / 邮箱 / 工号" required
                           value="{{ ticket.contact if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">问题类型 <span class="text-danger">*</span></label>
                    <select name="problem_type" class="form-select" required>
                        {% for t in problem_type_list %}
                        <option value="{{ t }}" {% if ticket and ticket.problem_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">优先级 <span class="text-danger">*</span></label>
                    <select name="priority" class="form-select" required>
                        {% for p in priority_list %}
                        <option value="{{ p }}" {% if ticket and ticket.priority == p %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">处理人</label>
                    <input type="text" name="assignee" class="form-control" placeholder="分配的处理人"
                           value="{{ ticket.assignee if ticket else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        {% for s in status_list %}
                        <option value="{{ s }}" {% if ticket and ticket.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">关闭时间</label>
                    <input type="datetime-local" name="close_time" class="form-control"
                           value="{{ ticket.close_time.strftime('%Y-%m-%dT%H:%M') if ticket and ticket.close_time else '' }}">
                </div>
                <div class="col-md-12">
                    <label class="form-label">问题描述 <span class="text-danger">*</span></label>
                    <textarea name="problem_description" class="form-control" rows="4" placeholder="详细描述遇到的问题..." required>{{ ticket.problem_description if ticket else '' }}</textarea>
                </div>
                <div class="col-md-12">
                    <label class="form-label">解决方案</label>
                    <textarea name="solution" class="form-control" rows="4" placeholder="处理方案和结果...">{{ ticket.solution if ticket else '' }}</textarea>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {{ '更新' if ticket else '创建工单' }}
                    </button>
                    <a href="{{ url_for('tickets.ticket_list') }}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> 取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
